spring:
  application:
    name: hakase

discord:
  token: ${DISCORD_BOT_TOKEN}

sentry:
  dsn: ${SENTRY_DSN}
  send-default-pii: true
  traces-sample-rate: 1.0
  profile-session-sample-rate: 1.0
  profile-lifecycle: TRACE
  logs:
    enabled: true

otel:
  propagators: sentry
  traces:
    exporter: otlp
  exporter:
    otlp:
      traces:
        endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
        protocol: http/protobuf
        headers: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS}
  logs:
    exporter: none
  metrics:
    exporter: none
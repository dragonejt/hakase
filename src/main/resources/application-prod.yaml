logging:
  structured:
    format:
      console: ecs

sentry:
  dsn: ${SENTRY_DSN}
  send-default-pii: true
  traces-sample-rate: 1.0
  profile-session-sample-rate: 1.0
  profile-lifecycle: TRACE
  logs:
    enabled: false

otel:
  propagators: sentry
  instrumentation:
    logback-appender:
      enabled: true
      experimental:
        capture-key-value-pair-attributes: true
  exporter:
    otlp:
      traces:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces
        protocol: http/protobuf
        headers: ${OTEL_EXPORTER_OTLP_HEADERS}
      logs:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/logs
        protocol: http/protobuf
        headers: ${OTEL_EXPORTER_OTLP_HEADERS}
  traces:
    exporter: otlp
  logs:
    exporter: otlp
  metrics:
    exporter: none

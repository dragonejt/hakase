name: delivery

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.REGISTRY }}/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set Docker Tag
        run: echo "GIT_REV=$(git rev-parse --short HEAD)" > "$GITHUB_ENV"

      - name: Setup Cloud Native Buildpacks
        uses: buildpacks/github-actions/setup-pack@v5.0.0

      - name: Build and Push Docker Image
        run: |
            pack build ${{ env.IMAGE_NAME }} \
              --path . \
              --builder heroku/builder:24 \
              --tag ${{ env.IMAGE_NAME }}:${{ env.GIT_REV }} \
              --publish

      - name: Create Sentry Release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dragonejt
          SENTRY_PROJECT: hakase-discord
        with:
          environment: production
name: delivery

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.REGISTRY }}/hakase

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.FOUNDRY_AUTH_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set Docker Tag
        run: echo "GIT_REV=$(git rev-parse --short HEAD)" > "$GITHUB_ENV"

      - name: Build and Push Docker Image
        run: |
          gradle bootBuildImage --no-daemon --imageName=${{ env.IMAGE_NAME }}:${{ env.GIT_REV }}
          docker push ${{ env.IMAGE_NAME }}:${{ env.GIT_REV }}
        env:
          FOUNDRY_AUTH_TOKEN: ${{ secrets.FOUNDRY_AUTH_TOKEN }}

      - name: Create Sentry Release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: dragonejt
          SENTRY_PROJECT: hakase
        with:
          environment: production
